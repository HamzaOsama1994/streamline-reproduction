# Lean MongoDB replacing the authors' mongodb-* chart templates. Service name and credentials match the URI
# hard-coded in shared/.../StoreStringInDBSink.java:
#   mongodb://adminuser:password123@mongodb-nodeport.default.svc.cluster.local/admin
# (These are the benchmark's public test credentials, used only inside the local throwaway cluster.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  labels: {app: mongodb}
spec:
  replicas: 1
  selector: {matchLabels: {app: mongodb}}
  template:
    metadata: {labels: {app: mongodb}}
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          args: ["--wiredTigerCacheSizeGB", "0.5"]
          ports: [{containerPort: 27017}]
          env:
            - {name: MONGO_INITDB_ROOT_USERNAME, value: adminuser}
            - {name: MONGO_INITDB_ROOT_PASSWORD, value: password123}
          resources:
            requests: {cpu: "500m", memory: "1Gi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-nodeport
spec:
  selector: {app: mongodb}
  ports: [{port: 27017, targetPort: 27017}]
