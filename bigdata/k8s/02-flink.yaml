# Standalone Flink 1.18 session cluster (plain manifests instead of the Flink Kubernetes Operator used by the
# authors' chart). Per-TaskManager resources follow the authors' chart (1 CPU, 2048m, 2 slots), which equals our
# planned "type 1" node after the /4 scaling of the paper's Table 1 (4 cores -> 1 core).
# metrics.latency.interval enables Flink latency markers (the paper measured end-to-end latency with latency markers).
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
data:
  flink-conf.yaml: |
    jobmanager.rpc.address: flink-jobmanager
    jobmanager.rpc.port: 6123
    blob.server.port: 6124
    rest.port: 8081
    jobmanager.memory.process.size: 1600m
    taskmanager.memory.process.size: 1800m
    taskmanager.numberOfTaskSlots: 2
    taskmanager.rpc.port: 6122
    parallelism.default: 1
    metrics.latency.interval: 5000
    metrics.latency.granularity: operator
    web.submit.enable: true
    # same reporter as the authors' chart; port unquoted because Flink 1.18's flink-conf.yaml parser keeps quotes
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249
    cluster.evenly-spread-out-slots: false
    # each job re-ships the 206 MB Beam fat jar to every TM; default 10 s slot timeout expired during deployment (see ENVIRONMENT doc section 7)
    taskmanager.slot.timeout: 120 s
    # added after E1 (2026-11-05, see ENVIRONMENT doc section 7): latency histograms keep the last N markers per
    # (source, operator) pair; the default 128 at a 5 s marker interval spans ~10 min, i.e. longer than a run, so
    # "post-warm-up" quantiles still contained warm-up markers. With 1 s markers (job option) 60 = a 60 s window.
    metrics.latency.history-size: 60
    # REST metric values were cached for 10 s (default), making 5 s counter differences alternate between 0 and 2x
    metrics.fetcher.update-interval: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
spec:
  selector: {app: flink, component: jobmanager}
  ports:
    - {name: rpc, port: 6123}
    - {name: blob, port: 6124}
    - {name: rest, port: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
spec:
  replicas: 1
  selector: {matchLabels: {app: flink, component: jobmanager}}
  template:
    metadata: {labels: {app: flink, component: jobmanager}}
    spec:
      containers:
        - name: jobmanager
          image: flink:1.18-java11
          args: ["jobmanager"]
          env: [{name: FLINK_PROPERTIES, value: ""}]
          ports: [{containerPort: 6123}, {containerPort: 6124}, {containerPort: 8081}]
          volumeMounts: [{name: flink-config, mountPath: /opt/flink/conf/flink-conf.yaml, subPath: flink-conf.yaml}]
          resources:
            requests: {cpu: "1", memory: "1600Mi"}
            limits: {cpu: "1", memory: "1600Mi"}
      volumes: [{name: flink-config, configMap: {name: flink-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
spec:
  replicas: 4
  selector: {matchLabels: {app: flink, component: taskmanager}}
  template:
    metadata: {labels: {app: flink, component: taskmanager}}
    spec:
      containers:
        - name: taskmanager
          image: flink:1.18-java11
          args: ["taskmanager"]
          ports: [{containerPort: 6122}, {containerPort: 9249}]
          volumeMounts: [{name: flink-config, mountPath: /opt/flink/conf/flink-conf.yaml, subPath: flink-conf.yaml}]
          resources:
            requests: {cpu: "1", memory: "2Gi"}
            limits: {cpu: "1", memory: "2Gi"}
      volumes: [{name: flink-config, configMap: {name: flink-config}}]
