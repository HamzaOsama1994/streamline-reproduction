# Lean single-broker Kafka 3.7.0 (KRaft) replacing the authors' Strimzi chart for the feasibility stage.
# The Service name equals the Strimzi bootstrap name hard-coded in the benchmark
# (shared/.../ReadSenMLSource.java, WriteStringSink.java: "kafka-cluster-kafka-bootstrap:9092"),
# so the benchmark code runs unmodified.
# Listeners: INTERNAL 9092 (in-cluster, Flink) | EXTERNAL 9093 (host producer via kubectl port-forward, localhost:9093,
# which kafkaProducer/Main.java hard-codes) | CONTROLLER 9094.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: {app: kafka}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.7.0
          ports:
            - {containerPort: 9092}
            - {containerPort: 9093}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka-cluster-kafka-bootstrap:9092,EXTERNAL://localhost:9093"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "INTERNAL"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9094"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx1g -Xms1g"}
          resources:
            requests: {cpu: "1", memory: "1536Mi"}
            limits: {cpu: "2", memory: "1536Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-cluster-kafka-bootstrap
spec:
  selector: {app: kafka}
  ports:
    - {name: internal, port: 9092, targetPort: 9092}
    - {name: external, port: 9093, targetPort: 9093}
